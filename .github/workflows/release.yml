# .github/workflows/latest-release.yml

name: Latest Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

env:
  VULKAN_HEADERS_TAG: v1.4.341

jobs:
  latest-release:
    name: Build latest release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release archive
        run: |
          set -euo pipefail

          mkdir -p dist

          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e VULKAN_HEADERS_TAG="${VULKAN_HEADERS_TAG}" \
            -v "$PWD":/work:ro \
            -v "$PWD/dist":/out \
            -w /tmp \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -c '
              set -euo pipefail

              dnf install -y \
                git \
                ninja-build \
                pkgconf-pkg-config \
                sqlite-devel \
                zlib-devel \
                vulkan-loader-devel \
                tar \
                gzip \
                binutils

              git clone --depth 1 \
                --branch "$VULKAN_HEADERS_TAG" \
                https://github.com/KhronosGroup/Vulkan-Headers.git \
                /tmp/Vulkan-Headers

              cmake -S /tmp/Vulkan-Headers \
                    -B /tmp/Vulkan-Headers/build

              cmake --install /tmp/Vulkan-Headers/build \
                    --prefix /usr/local

              cmake -S /work \
                    -B /tmp/build \
                    -G Ninja \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DFETCHCONTENT_QUIET=OFF \
                    -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
                    -DDENOX_STATIC_LIBSTDCPP=ON \
                    -DDENOX_ENABLE_NVML_CLOCKCTRL=OFF \
                    -DDENOX_SAN=OFF \
                    -DBUILD_TESTING=OFF

              cmake --build /tmp/build \
                    -j"$(nproc)" \
                    --target denox

              cmake --install /tmp/build \
                    --prefix /tmp/install

              echo "Dynamic dependencies:"
              ldd /tmp/install/bin/denox || true

              echo "Required GLIBC versions:"
              readelf --version-info /tmp/install/bin/denox \
                | grep GLIBC \
                | sort -u \
                || true

              mkdir -p /tmp/package/denox-linux-x86_64

              cp -a /tmp/install/. \
                    /tmp/package/denox-linux-x86_64/

              tar -czf /out/denox-linux-x86_64.tar.gz \
                    -C /tmp/package \
                    denox-linux-x86_64

              chown "$HOST_UID:$HOST_GID" \
                    /out/denox-linux-x86_64.tar.gz
            '

      - name: Ensure this commit is still latest main
        if: ${{ !env.ACT || env.PUBLISH_RELEASE == 'true' }}
        run: |
          set -euo pipefail

          git fetch origin main

          CURRENT_MAIN="$(git rev-parse origin/main)"

          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            echo "This workflow run is no longer the latest main."
            echo "Current main: $CURRENT_MAIN"
            echo "This build:   $GITHUB_SHA"
            echo "Skipping release publication."
            exit 0
          fi

      - name: Move latest tag to this commit
        if: ${{ !env.ACT || env.PUBLISH_RELEASE == 'true' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -f latest "$GITHUB_SHA"
          git push origin latest --force

      - name: Create or update latest GitHub Release
        if: ${{ !env.ACT || env.PUBLISH_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            gh release edit latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Latest main build" \
              --notes "Automatically built from main commit ${GITHUB_SHA}." \
              --latest

            gh release upload latest \
              dist/denox-linux-x86_64.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create latest \
              dist/denox-linux-x86_64.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Latest main build" \
              --notes "Automatically built from main commit ${GITHUB_SHA}." \
              --latest
          fi
