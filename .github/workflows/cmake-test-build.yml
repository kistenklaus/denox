name: CMake Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  VULKAN_HEADERS_TAG: vulkan-sdk-1.4.350.0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - ubuntu:22.04
          - debian:12
          - fedora:39
          - archlinux:latest
        compiler:
          - gcc
        build_type:
          - Release
          - Debug

    container: ${{ matrix.container }}

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      COMPILER: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            apt-get update
            apt-get install -y \
              ca-certificates \
              build-essential \
              clang \
              cmake \
              ninja-build \
              git \
              python3 \
              python3-pip \
              libvulkan-dev \
              vulkan-tools \
              vulkan-validationlayers-dev \
              libsqlite3-dev \
              zlib1g-dev

          elif command -v dnf &> /dev/null; then
            dnf install -y \
              ca-certificates \
              gcc gcc-c++ \
              clang \
              cmake \
              ninja-build \
              git \
              python3 \
              python3-pip \
              vulkan-loader-devel \
              vulkan-headers \
              vulkan-validation-layers-devel \
              sqlite-devel \
              zlib-devel

          elif command -v pacman &> /dev/null; then
            pacman -Sy --noconfirm archlinux-keyring
            pacman -Syu --noconfirm
            pacman -S --noconfirm \
              base-devel \
              clang \
              cmake \
              ninja \
              git \
              python \
              python-pip \
              vulkan-devel \
              vulkan-validation-layers \
              sqlite \
              zlib
          fi

      - name: Install pinned Vulkan headers
        run: |
          git clone \
            --depth 1 \
            --branch "$VULKAN_HEADERS_TAG" \
            https://github.com/KhronosGroup/Vulkan-Headers.git \
            /tmp/Vulkan-Headers

          cmake -S /tmp/Vulkan-Headers \
                -B /tmp/Vulkan-Headers/build \
                -G Ninja \
                -DCMAKE_INSTALL_PREFIX=/usr/local

          cmake --install /tmp/Vulkan-Headers/build

          grep '#define VK_HEADER_VERSION ' /usr/local/include/vulkan/vulkan_core.h

      - name: Select compiler
        run: |
          if [ "$COMPILER" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_UNITY_BUILD=OFF \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DVulkan_INCLUDE_DIR=/usr/local/include

      - name: Build
        run: cmake --build build
